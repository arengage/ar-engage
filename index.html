<!DOCTYPE html>
<html>
<head>
  <script>
    // const modelUrl = "https://github.com/wasiongit/ar-project/raw/refs/heads/main/matchbox.glb";
    const modelUrl = encodeURIComponent('https://raw.githubusercontent.com/wasiongit/ar-engage/refs/heads/main/models/nike-jordan.glb');
    const usdzUrl = "https://raw.githubusercontent.com/wasiongit/ar-engage/refs/heads/main/models/nike-jordan.usdz";
    
    if (/Android/i.test(navigator.userAgent)) {
      // Android: Use intent
      window.location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${modelUrl}&title=Create+Your+Own+Items+Today&mode=ar_preferred&disable_occlusion=true&link=https://www.arengage.com/#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(window.location.href)};end;`;
    } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      setTimeout(() => {
        window.location.href = usdzUrl; // may still download if MIME wrong
      }, 500);
    } else {
      // Desktop/unsupported: Show 3D model viewer
      window.location.href = "https://www.arengage.com";
    }
  </script>
</head>
<body>
  Redirecting to AR...
</body>
</html>
