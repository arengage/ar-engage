<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Engage Demo</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      max-width: 1000px;
      height: 1200px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <h2>Nike Jordan WebAR Demo</h2>

  <model-viewer src="https://raw.githubusercontent.com/wasiongit/ar-engage/refs/heads/main/models/nike-jordan.glb"
                ios-src="https://raw.githubusercontent.com/wasiongit/ar-engage/refs/heads/main/models/nike-jordan.usdz"
                alt="Nike Jordan Shoe"
                ar
                ar-modes="scene-viewer quick-look"
                camera-controls
                auto-rotate
                shadow-intensity="1">
                  <button slot="ar-button" style="font-size:2rem; padding:1rem 3rem; border-radius:1.5rem; background:#3638f7; color:#fff;">
    👟 View in AR
  </button>
  </model-viewer>

</body>
</html>
